name: Baguette-owned Bake validation

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.head_ref == 'agent/baguette-owned-bake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/baguette-owned-bake
          fetch-depth: 0
          submodules: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalise dependency tree
        run: |
          set -Eeuo pipefail
          git rm -f bake
          git submodule sync --recursive
          git submodule update --init kittyx src/asm thistlecc baguette
          git -C baguette fetch origin b1d691041bd3ca18aa318e494323d02b29f67995
          git -C baguette checkout b1d691041bd3ca18aa318e494323d02b29f67995
          git add baguette
          git submodule update --init --recursive
          rm .github/workflows/agent-baguette-owned-bake.yml
          git config user.name "Kitty Crow"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git add -A
          git commit -m "Route Bake through Baguette"
          git push origin HEAD:agent/baguette-owned-bake

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build and test mikuOS
        run: npm test

      - name: Verify dependency ownership
        run: |
          set -Eeuo pipefail
          test ! -e bake
          ! grep -q 'path = bake' .gitmodules
          test -e baguette/vendor/bake/.git
          test ! -e scripts/teto-bake.ts
          ! grep -q 'preteto:' package.json
          ! grep -q 'build/teto-baked' baguette.config.json

      - name: Remove obsolete branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=agent/baguette-owned-bake&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
              fi
            done

      - name: Remove merged work branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            merged_at="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged_at // empty')"
            if [ -n "$merged_at" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_HEAD_REF" || true
              exit 0
            fi
            sleep 10
          done
          echo "Pull request was not merged before the cleanup window closed" >&2
          exit 1
