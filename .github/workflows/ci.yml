name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/mikuos-build.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-build-log
          path: /tmp/mikuos-build.log
          if-no-files-found: error

      - name: Test
        run: npm test
