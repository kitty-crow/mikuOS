name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise recursive submodules
        shell: bash
        run: |
          set -o pipefail
          git submodule sync --recursive
          git submodule update --init --recursive 2>&1 | tee /tmp/mikuos-submodules.log

      - name: Upload failed submodule log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-submodule-log
          path: /tmp/mikuos-submodules.log
          if-no-files-found: ignore

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/mikuos-build.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-build-log
          path: /tmp/mikuos-build.log
          if-no-files-found: ignore

      - name: Compile and cross-check canonical Thistle instruction helpers
        shell: bash
        run: |
          bun baguette/src/compiler.ts --config baguette.thistle-core.config.json --skip-determinism-check
          bun scripts/ci/test-thistle-native-core.ts

      - name: Diagnose canonical Thistle source lowering (non-blocking, migration work)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun baguette/src/compiler.ts --config baguette.thistle-probe.config.json --validate-only 2>&1 | tee /tmp/thistle-source-probe.log

      - name: Test
        run: npm test
