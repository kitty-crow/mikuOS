name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise public build submodules
        shell: bash
        run: |
          set -o pipefail
          git submodule sync
          git submodule update --init kittyx src/asm baguette thistlecc bake 2>&1 | tee /tmp/mikuos-submodules.log

      - name: Upload failed submodule log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-submodule-log
          path: /tmp/mikuos-submodules.log
          if-no-files-found: ignore

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Clean
        run: npm run clean

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.json

      - name: Build static web assets
        run: node build/tool/post.js

      - name: Build Teto
        shell: bash
        run: |
          set -o pipefail
          npm run teto:build 2>&1 | tee /tmp/mikuos-build.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-build-log
          path: /tmp/mikuos-build.log
          if-no-files-found: ignore

      - name: Run NERU selector tests
        run: node --test build/backends/neru/cli.test.js

      - name: Run mikuOS tests
        run: node build/test/all.js
