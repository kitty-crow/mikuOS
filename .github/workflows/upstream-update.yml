name: Test teto upstream

on:
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact upstream commit to test
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-teto
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Select candidate Teto gitlink
        env:
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: scripts/ci/update-upstream.sh "$REVISION"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build && bun run test
      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.client_payload.new_commit || inputs.revision }}
        run: scripts/ci/open-upstream-pr.sh "$REVISION"
